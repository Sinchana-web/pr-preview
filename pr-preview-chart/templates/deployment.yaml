apiVersion: apps/v1
kind: Deployment
metadata:
  name: pr-preview-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pr-preview-app
  template:
    metadata:
      labels:
        app: pr-preview-app
    spec:
      containers:
        - name: pr-preview-app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 3000
